name: Battletoads Scale2x experimental
on:
  push:
    paths:
      - '.github/workflows/scale2x.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu libc6-dev-mipsel-cross qemu-user
      - name: Fetch upstream
        run: |
          git clone --depth 1 https://github.com/libretro/mame2003-libretro.git upstream
          git -C upstream rev-parse HEAD | grep '^6db8b53'
          git -C upstream rev-parse HEAD
      - name: Add compatibility symbol aliases
        run: |
          cat > /tmp/compat.h <<'EOF'
          __asm__(".symver exp,exp@GLIBC_2.0");
          __asm__(".symver pow,pow@GLIBC_2.0");
          __asm__(".symver log,log@GLIBC_2.0");
          EOF
          # Use the legacy stat entry points exported by glibc before 2.33.
          cat > /tmp/compat.c <<'EOF'
          #define _LARGEFILE64_SOURCE
          #include <sys/stat.h>
          extern int __xstat64(int, const char *, struct stat64 *);
          extern int __fxstat64(int, int, struct stat64 *);
          int __wrap_stat64(const char *p, struct stat64 *s) { return __xstat64(3,p,s); }
          int __wrap_fstat64(int fd, struct stat64 *s) { return __fxstat64(3,fd,s); }
          EOF
          cat >> /tmp/compat.c <<'EOF'
          extern int __lxstat64(int, const char *, struct stat64 *);
          extern int __fxstatat64(int, int, const char *, struct stat64 *, int);
          int __wrap_lstat64(const char *p, struct stat64 *s) { return __lxstat64(3,p,s); }
          int __wrap_fstatat64(int fd, const char *p, struct stat64 *s, int flags) { return __fxstatat64(3,fd,p,s,flags); }
          EOF
          mipsel-linux-gnu-gcc -march=mips32r2 -mabi=32 -mhard-float -mfp32 -fPIC -c /tmp/compat.c -o /tmp/compat.o
          # CubeGM capcom reference returns zero from retro_is_support.
          # Progress hook is optional; retain the pointer without invoking an unverified ABI.
          cat > /tmp/cubegm.c <<'EOF'
          #include <stddef.h>
          int retro_is_support(const char *path) { (void)path; return 0; }
          static void (*volatile progress_callback)(void);
          void retro_set_progress_callback(void (*callback)(void)) { progress_callback = callback; }
          EOF
          mipsel-linux-gnu-gcc -march=mips32r2 -mabi=32 -mhard-float -mfp32 -fPIC -c /tmp/cubegm.c -o /tmp/cubegm.o
          cat upstream/link.T
          grep -q 'retro_\*' upstream/link.T || sed -i '/global:/a\    retro_is_support; retro_set_progress_callback;' upstream/link.T
          # LIBS must be assigned before the target prerequisites/recipe are expanded.
          # Preserve the legacy large-file APIs, including directory-relative stat.
          printf '\nLIBS += /tmp/compat.o /tmp/cubegm.o -Wl,--wrap=stat64,--wrap=fstat64,--wrap=lstat64,--wrap=fstatat64\n' >> upstream/Makefile
      - name: Initialize critical options even on minimal frontends
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/mame2003/core_options.c')
          s=p.read_text()
          old='  bool reset_control_descriptions = false;'
          new=old+'''
          if (first_time)
          {
            options.samplerate = 48000;
            options.brightness = 1.0;
            options.gamma = 1.0;
          }
          '''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Add bounded RGB565 Scale2x output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/mame2003/video.c')
          s=p.read_text()
          def once(a,b):
              global s
              assert s.count(a)==1,a
              s=s.replace(a,b)
          marker='/* Retrieve output geometry (i.e. window dimensions) */'
          once(marker,'''/* Dedicated Battletoads core: RGB565 Scale2x, bounded static buffer. */
          static uint16_t scaled_pixels[1024*448];
          static void scaled_video(const void *data,unsigned w,unsigned h,size_t pitch)
          {
             unsigned x,y;
             if(video_stride_out!=2 || !w || !h || w>512 || h>224)
             {
                video_cb(data,w,h,pitch);
                return;
             }
             if(data)
             {
                for(y=0;y<h;y++)
                {
                   const uint16_t *cur=(const uint16_t*)((const char*)data+y*pitch);
                   const uint16_t *top=y?(const uint16_t*)((const char*)data+(y-1)*pitch):cur;
                   const uint16_t *bot=y+1<h?(const uint16_t*)((const char*)data+(y+1)*pitch):cur;
                   uint16_t *o0=scaled_pixels+4*y*w;
                   uint16_t *o1=o0+2*w;
                   for(x=0;x<w;x++)
                   {
                      uint16_t b=top[x],d=cur[x?x-1:x],e=cur[x],f=cur[x+1<w?x+1:x],hh=bot[x];
                      if(b!=hh && d!=f)
                      {
                         o0[2*x]=d==b?d:e; o0[2*x+1]=b==f?f:e;
                         o1[2*x]=d==hh?d:e; o1[2*x+1]=hh==f?f:e;
                      }
                      else {o0[2*x]=o0[2*x+1]=o1[2*x]=o1[2*x+1]=e;}
                   }
                }
             }
             video_cb(data?scaled_pixels:NULL,w*2,h*2,w*4);
          }

          '''+marker)
          once('   geom->aspect_ratio = video_hw_transpose', '''   if (video_stride_out == 2 && vis_w <= 512 && vis_h <= 224)
             {
                geom->base_width *= 2;
                geom->base_height *= 2;
                geom->max_width *= 2;
                geom->max_height *= 2;
             }
             geom->aspect_ratio = video_hw_transpose''')
          once('if (sw_framebuffer_supported == 0)','if (1)')
          # Replace calls in frame delivery only, not in the helper.
          for call in ['video_cb(direct_out, vis_width, vis_height, direct_out_pitch);','video_cb(base, vis_width, vis_height, pitch);','video_cb(out, vis_width, vis_height, out_pitch);','video_cb(NULL, vis_width, vis_height, vis_width * video_stride_out);']:
              assert call in s,call
              s=s.replace(call,call.replace('video_cb(','scaled_video('))
          p.write_text(s)
          PY
      - name: Compile baseline
        run: |
          make -C upstream -j2 platform=unix ARCH=mips CPU_ARCH=mips CC='mipsel-linux-gnu-gcc -march=mips32r2 -mabi=32 -mhard-float -mfp32 -fcommon -static-libgcc -include /tmp/compat.h' AR=mipsel-linux-gnu-ar
      - name: Inspect binary
        run: |
          mkdir -p output
          cp upstream/mame2003_libretro.so output/
          git -C upstream rev-parse HEAD > output/source-commit.txt
          mipsel-linux-gnu-readelf -h -A -d -V -Ws output/mame2003_libretro.so > output/elf-report.txt
          mipsel-linux-gnu-readelf --dyn-syms --wide output/mame2003_libretro.so | grep -E 'GLIBC_2\.(2[1-9]|[3-9][0-9])' || true
          grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' output/elf-report.txt | sort -Vu
          if grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' output/elf-report.txt | sort -Vu | awk -F'[_.]' '$2>2 || ($2==2 && $3>20) {bad=1} END {exit !bad}'; then echo 'Newer glibc symbols remain'; exit 1; fi
      - name: Verify core loading in MIPS userspace
        run: |
          cat > /tmp/smoke.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <dlfcn.h>
          #include <sys/stat.h>
          #include <string.h>
          #include "libretro.h"
          int main(int argc, char **argv) {
            if (argc != 2) return 1;
            void *h = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
            if (!h) { fprintf(stderr,"%s\n",dlerror()); return 2; }
            const char *names[]={"retro_api_version","retro_get_system_info","retro_init","retro_run","retro_load_game","retro_is_support","retro_set_progress_callback","retro_set_environment","retro_set_video_refresh","retro_set_audio_sample","retro_set_audio_sample_batch","retro_set_input_poll","retro_set_input_state"};
            for (unsigned i=0;i<sizeof(names)/sizeof(names[0]);i++) if(!dlsym(h,names[i])) { fprintf(stderr,"missing %s\n",names[i]); return 3; }
            unsigned (*version)(void)=dlsym(h,"retro_api_version");
            void (*info)(struct retro_system_info *)=dlsym(h,"retro_get_system_info");
            struct retro_system_info x={0};
            info(&x);
            printf("API %u, core %s %s, extensions %s\n",version(),x.library_name,x.library_version,x.valid_extensions);
            if(version()!=1) return 4;
            int (*support)(const char *)=dlsym(h,"retro_is_support");
            if(support("btoads.zip")!=0) return 5;
            dlclose(h);
            return 0;
          }
          EOF
          mipsel-linux-gnu-gcc -march=mips32r2 -mabi=32 -mhard-float -mfp32 -I upstream/src/libretro-common/include /tmp/smoke.c -ldl -o /tmp/smoke
          qemu-mipsel -cpu 74Kf -L /usr/mipsel-linux-gnu /tmp/smoke "$PWD/output/mame2003_libretro.so"
          mipsel-linux-gnu-readelf -Ws output/mame2003_libretro.so | grep -w driver_btoads > output/btoads-driver.txt
          cp output/mame2003_libretro.so output/libemu_btoads.so
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mame2003-cubegm-v015-scale2x
          path: output/
